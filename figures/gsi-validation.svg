<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="15">
  <rect width="960" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2540"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#0f2540;stroke-width:1.2}
    .hi{fill:#eef0f3;stroke:#0f2540;stroke-width:1.6}
    .t{fill:#1a1a1a}
    .s{fill:#5a6270;font-size:13px}
    .k{fill:#0f2540;font-weight:700}
    .ln{stroke:#0f2540;stroke-width:1.2;fill:none;marker-end:url(#arr)}
  </style>

  <!-- 입력 두 갈래 -->
  <rect class="box" x="20" y="40" width="200" height="70" rx="2"/>
  <text class="t" x="120" y="68" text-anchor="middle">사람이 만든 변경</text>
  <text class="s" x="120" y="90" text-anchor="middle">분류 규칙 · 검증 로직 수정</text>

  <rect class="box" x="20" y="200" width="200" height="90" rx="2"/>
  <text class="t" x="120" y="228" text-anchor="middle">AI 코딩 에이전트의 변경</text>
  <text class="s" x="120" y="250" text-anchor="middle">작업 전 세션 규약 읽기</text>
  <text class="s" x="120" y="268" text-anchor="middle">결정 기록 계약 준수</text>

  <path class="ln" d="M220,75 L290,75 L290,160 L320,160"/>
  <path class="ln" d="M220,245 L290,245 L290,160 L320,160"/>

  <!-- 현장 데이터 -->
  <rect class="box" x="320" y="120" width="170" height="80" rx="2"/>
  <text class="t" x="405" y="148" text-anchor="middle">현장 데이터 리플레이</text>
  <text class="s" x="405" y="170" text-anchor="middle">실제 점군 + PLC 신호</text>
  <text class="s" x="405" y="188" text-anchor="middle">회귀 테스트 20건</text>

  <line class="ln" x1="490" y1="160" x2="520" y2="160"/>

  <!-- CI 게이트 강조 -->
  <rect class="hi" x="520" y="90" width="230" height="140" rx="2"/>
  <text class="k" x="635" y="118" text-anchor="middle">CI 게이트: 같은 검증을 통과해야 병합</text>
  <text class="s" style="font-size:12px" x="635" y="144" text-anchor="middle">분류 기준선: 구간 다수결 + 미분류 비율 상하한</text>
  <text class="s" style="font-size:12px" x="635" y="162" text-anchor="middle">(센서 노이즈는 허용, 성능 후퇴는 차단)</text>
  <text class="s" x="635" y="186" text-anchor="middle">응답 지연 p95 / p99 상한</text>
  <text class="s" x="635" y="210" text-anchor="middle">자동 리뷰 하네스</text>

  <line class="ln" x1="750" y1="160" x2="780" y2="160"/>

  <!-- 출력 -->
  <rect class="box" x="780" y="120" width="160" height="80" rx="2"/>
  <text class="t" x="860" y="148" text-anchor="middle">병합 · 24시간 운영</text>
  <text class="s" x="860" y="170" text-anchor="middle">6개월간 PR 95건 통과</text>
  <text class="s" x="860" y="188" text-anchor="middle">원인·개선은 결정 기록으로</text>

  <text class="s" x="480" y="318" text-anchor="middle">항만 자동화 크레인용 LiDAR 컨테이너 인식 시스템 · 인식 결과는 원본 데이터와 함께 기록해 사후 재현 가능</text>
</svg>
