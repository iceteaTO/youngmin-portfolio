<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16">
  <rect width="960" height="240" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2540"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#0f2540;stroke-width:1.2}
    .hi{fill:#eef0f3;stroke:#0f2540;stroke-width:1.6}
    .t{fill:#1a1a1a}
    .s{fill:#5a6270;font-size:13px}
    .k{fill:#0f2540;font-weight:700}
    .ln{stroke:#0f2540;stroke-width:1.2;fill:none;marker-end:url(#arr)}
  </style>

  <rect class="box" x="20" y="30" width="200" height="70" rx="2"/>
  <text class="t" x="120" y="62" text-anchor="middle">사람이 만든 변경</text>
  <text class="s" x="120" y="84" text-anchor="middle">분류 규칙, 검증 로직</text>

  <rect class="box" x="20" y="140" width="200" height="70" rx="2"/>
  <text class="t" x="120" y="172" text-anchor="middle">AI 코딩 에이전트의 변경</text>
  <text class="s" x="120" y="194" text-anchor="middle">세션 규약, 결정 기록 계약</text>

  <path class="ln" d="M220,65 L280,65 L280,120 L320,120"/>
  <path class="ln" d="M220,175 L280,175 L280,120 L320,120"/>

  <rect class="box" x="320" y="80" width="180" height="80" rx="2"/>
  <text class="t" x="410" y="114" text-anchor="middle">현장 데이터 리플레이</text>
  <text class="s" x="410" y="136" text-anchor="middle">회귀 테스트 20건</text>

  <line class="ln" x1="500" y1="120" x2="530" y2="120"/>

  <rect class="hi" x="530" y="70" width="230" height="100" rx="2"/>
  <text class="k" x="645" y="106" text-anchor="middle">CI 게이트</text>
  <text class="s" x="645" y="128" text-anchor="middle">회귀 20건 통과 + 지연 p95/p99 상한</text>
  <text class="s" x="645" y="146" text-anchor="middle">사람과 AI 모두 같은 기준</text>

  <line class="ln" x1="760" y1="120" x2="790" y2="120"/>

  <rect class="box" x="790" y="80" width="150" height="80" rx="2"/>
  <text class="t" x="865" y="114" text-anchor="middle">병합, 24시간 운영</text>
  <text class="s" x="865" y="136" text-anchor="middle">성능 후퇴 없는 변경만</text>
</svg>
