<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16">
  <rect width="960" height="180" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2540"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#0f2540;stroke-width:1.2}
    .hi{fill:#eef0f3;stroke:#0f2540;stroke-width:1.6}
    .t{fill:#1a1a1a}
    .s{fill:#5a6270;font-size:13px}
    .k{fill:#0f2540;font-weight:700}
    .ln{stroke:#0f2540;stroke-width:1.2;fill:none;marker-end:url(#arr)}
  </style>

  <rect class="box" x="20" y="50" width="160" height="80" rx="2"/>
  <text class="t" x="100" y="86" text-anchor="middle">사업보고서 PDF</text>
  <text class="s" x="100" y="108" text-anchor="middle">340여 건</text>

  <line class="ln" x1="180" y1="90" x2="210" y2="90"/>

  <rect class="box" x="210" y="50" width="160" height="80" rx="2"/>
  <text class="t" x="290" y="86" text-anchor="middle">페이지 단위 파싱</text>
  <text class="s" x="290" y="108" text-anchor="middle">본문과 표를 함께</text>

  <line class="ln" x1="370" y1="90" x2="400" y2="90"/>

  <rect class="box" x="400" y="50" width="160" height="80" rx="2"/>
  <text class="t" x="480" y="86" text-anchor="middle">LLM 함수 호출</text>
  <text class="s" x="480" y="108" text-anchor="middle">JSON 스키마 강제</text>

  <line class="ln" x1="560" y1="90" x2="590" y2="90"/>

  <rect class="hi" x="590" y="40" width="180" height="100" rx="2"/>
  <text class="k" x="680" y="78" text-anchor="middle">항목마다 근거 필수</text>
  <text class="s" x="680" y="100" text-anchor="middle">근거 인용문 + 쪽 번호</text>
  <text class="s" x="680" y="118" text-anchor="middle">없으면 빈 결과</text>

  <line class="ln" x1="770" y1="90" x2="800" y2="90"/>

  <rect class="box" x="800" y="50" width="140" height="80" rx="2"/>
  <text class="t" x="870" y="86" text-anchor="middle">PostgreSQL 적재</text>
  <text class="s" x="870" y="108" text-anchor="middle">183,398건</text>
</svg>
