<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="16">
  <rect width="960" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f2540"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#0f2540;stroke-width:1.2}
    .hi{fill:#eef0f3;stroke:#0f2540;stroke-width:1.6}
    .t{fill:#1a1a1a}
    .s{fill:#5a6270;font-size:13px}
    .k{fill:#0f2540;font-weight:700}
    .ln{stroke:#0f2540;stroke-width:1.2;fill:none;marker-end:url(#arr)}
    .back{stroke:#0f2540;stroke-width:1.2;fill:none;stroke-dasharray:6 4;marker-end:url(#arr)}
  </style>

  <rect class="box" x="20" y="50" width="160" height="80" rx="2"/>
  <text class="t" x="100" y="86" text-anchor="middle">문헌, 실험 데이터</text>
  <text class="s" x="100" y="108" text-anchor="middle">약 500건</text>

  <line class="ln" x1="180" y1="90" x2="210" y2="90"/>

  <rect class="box" x="210" y="50" width="160" height="80" rx="2"/>
  <text class="t" x="290" y="86" text-anchor="middle">XGBoost 회귀</text>
  <text class="s" x="290" y="108" text-anchor="middle">R² 약 0.82</text>

  <line class="ln" x1="370" y1="90" x2="400" y2="90"/>

  <rect class="hi" x="400" y="40" width="200" height="100" rx="2"/>
  <text class="k" x="500" y="78" text-anchor="middle">SHAP 원인 인자 해석</text>
  <text class="s" x="500" y="100" text-anchor="middle">소결 온도 720~740℃</text>
  <text class="s" x="500" y="118" text-anchor="middle">Li 비율 1.05~1.10</text>

  <line class="ln" x1="600" y1="90" x2="630" y2="90"/>

  <rect class="box" x="630" y="50" width="150" height="80" rx="2"/>
  <text class="t" x="705" y="86" text-anchor="middle">합성 데이터</text>
  <text class="s" x="705" y="108" text-anchor="middle">10만 건</text>

  <line class="ln" x1="780" y1="90" x2="810" y2="90"/>

  <rect class="box" x="810" y="50" width="130" height="80" rx="2"/>
  <text class="t" x="875" y="86" text-anchor="middle">미탐색 후보</text>
  <text class="s" x="875" y="108" text-anchor="middle">상위 5% 조합</text>

  <path class="back" d="M875,130 L875,180 L100,180 L100,132"/>
  <text class="s" x="488" y="200" text-anchor="middle">실험으로 검증해 데이터에 되돌림</text>
</svg>
